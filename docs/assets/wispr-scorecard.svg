  <!-- Quote & Workflow Callout -->
  <g transform="translate(32, 226)">
    <rect width="656" height="84" rx="10" fill="#131B2E" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
    <path d="M20 20 L20 64" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />
    <text x="32" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Voice-Native Development Workflow:</text>
    <text x="32" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#94A3B8">"All complex architecture instructions, Switch template YAML rules, RFC 6901 pointers, and Antigravity prompts</text>
    <text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#94A3B8">were dictated directly into Wispr Flow without touching the keyboard. Zero hallucinations, flawless code output."</text>
