<svg width="720" height="340" viewBox="0 0 720 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8B5CF6" stopOpacity="0.2" />
      <stop offset="50%" stopColor="#06B6D4" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#07090E" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="100%" stopColor="#6366F1" />
