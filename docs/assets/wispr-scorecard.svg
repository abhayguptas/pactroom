  <!-- Background Card -->
  <rect width="720" height="340" rx="16" fill="#0A0E17" stroke="#1E293B" stroke-width="1.5" />
  <rect width="720" height="340" rx="16" fill="url(#cardGlow)" />

  <!-- Top Bar -->
  <g transform="translate(32, 28)">
