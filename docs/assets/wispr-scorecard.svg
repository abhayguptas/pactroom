    <rect width="40" height="40" rx="10" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
    <path d="M14 20 C14 16.6863 16.6863 14 20 14 C23.3137 14 26 16.6863 26 20 C26 23.3137 23.3137 26 20 26 C16.6863 26 14 23.3137 14 20 Z" fill="url(#purpleGrad)" />
    <circle cx="20" cy="20" r="3" fill="#FFFFFF" />
    <path d="M10 20 C10 14.4772 14.4772 10 20 10 C25.5228 10 30 14.4772 30 20" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M7 20 C7 12.8203 12.8203 7 20 7 C27.1797 7 33 12.8203 33 20" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <text x="52" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Wispr Flow Insights</text>
    <text x="52" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">PactRoom Development Voice Telemetry Scorecard • Flip the Switch Hackathon</text>

    <!-- Verified Badge -->
    <g transform="translate(540, 6)">
      <rect width="116" height="26" rx="13" fill="#064E3B" fill-opacity="0.6" stroke="#059669" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#34D399" />
      <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#A7F3D0">VOICE VERIFIED</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="32" y1="92" x2="688" y2="92" stroke="#1E293B" stroke-width="1" />

  <!-- 4 Metrics Grid -->
  <g transform="translate(32, 114)">
